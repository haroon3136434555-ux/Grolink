<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0aa77a"><title>GroLink</title>
<style>
:root{--g:#0aa77a;--g2:#087f62;--bg:#f4faf8;--card:#fff;--text:#14332c;--muted:#6e817b;--line:#dcebe6}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eefaf6,#f7fbff);font-family:Inter,system-ui,sans-serif;color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:470px;margin:auto;min-height:100vh;background:var(--bg);box-shadow:0 0 40px #0001}.top{padding:16px 18px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}.logo{font-weight:950;font-size:25px}.logo span{color:var(--g)}.screen{padding:18px 18px 95px}.hero{text-align:center;padding:42px 22px 15px}.hero h1{font-size:44px;margin:0}.hero h1 span{color:var(--g)}.muted{color:var(--muted);line-height:1.5}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 8px 22px #087f6210}.btn{width:100%;border:0;background:var(--g);color:#fff;padding:13px 16px;border-radius:13px;font-weight:850;margin-top:10px}.btn.alt{background:#fff;color:var(--g2);border:1px solid #a9dccd}.btn.small{width:auto;padding:9px 12px;margin:0;font-size:13px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);font-weight:800;margin-bottom:5px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}textarea{min-height:120px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chip{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-weight:700;font-size:13px}.chip.on{border-color:var(--g);background:#e8faf4;color:var(--g2)}.match{display:flex;gap:11px;align-items:center}.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#0aa77a,#49c7a4);color:#fff;display:grid;place-items:center;font-weight:900;flex:none}.main{flex:1}.meta{font-size:12px;color:var(--muted)}.score{font-weight:900;color:var(--g2);font-size:18px}.why{background:#ecfaf5;padding:10px;border-radius:12px;font-size:13px;margin-top:10px}.pill{display:inline-block;padding:5px 8px;border-radius:99px;background:#eaf7f3;color:var(--g2);font-size:11px;font-weight:800;margin:3px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:470px;height:70px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;z-index:9}.nav button{background:none;border:0;color:#71827d;font-size:11px;font-weight:800}.nav button.active{color:var(--g2)}.nav i{display:block;font-size:20px;font-style:normal}.msg{padding:10px 12px;border-radius:14px;margin:8px 0;max-width:80%;background:#fff;border:1px solid var(--line)}.msg.me{margin-left:auto;background:#dff7ef}.chat{height:55vh;overflow:auto}.row{display:flex;gap:8px;align-items:center}.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:#14332c;color:#fff;padding:10px 14px;border-radius:12px;display:none;z-index:20;font-size:13px}@media(min-width:700px){body{padding:20px}.app{border-radius:24px;overflow:hidden}}
</style></head><body><div class="app" id="app"></div><div class="toast" id="toast"></div>
<script>
let me=null,tab="home",cache={};
const A=["Entrepreneur","Student","Professional","Creative","Learner","Traveler","Fitness enthusiast","Technology enthusiast","Reader","Personal growth"];
const H=["Reading","Exercise","Early morning","Night owl","Meditation","Learning","Business","Traveling","Gaming","Movies","Family time","Spiritual"];
const G=["Build a business","Grow my career","Find a better job","Become financially independent","Become more confident","Improve communication","Build discipline","AI","Business","Languages","Technology","Finance","Marketing","Leadership","Travel internationally","Learn about cultures","Build meaningful friendships","Personal growth"];
const P=["Meaningful Friendship","Learning Partner","Accountability Partner","Business Friend","Cultural Exchange","Travel Friend","Language Partner","Personal Growth"];
const I=["Business","Technology","AI","Travel","Books","Fitness","Food","Photography","Movies","Sports","Science","History","Culture","Entrepreneurship","Education","Finance","Personal Development","Music","Gaming"];
const api=async(u,o={})=>{let r=await fetch(u,{headers:{"Content-Type":"application/json"},...o});let j=await r.json();if(!r.ok)throw Error(j.error||"Something went wrong");return j};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){let x=document.querySelector("#toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1800)}
async function boot(){try{me=await api("/api/me");render()}catch{auth()}}
function auth(){document.querySelector("#app").innerHTML=`<div class="hero"><div class="logo">Gro<span>Link</span></div><h1>Connect Beyond Distance.</h1><p class="muted">Find meaningful friendships based on shared goals, habits, interests and experiences.</p></div><div class="screen"><div class="card"><h2>Create account</h2><div class="field"><label>NAME</label><input id="name" placeholder="Your name"></div><div class="field"><label>EMAIL</label><input id="email" type="email" placeholder="you@example.com"></div><div class="field"><label>PASSWORD</label><input id="pass" type="password" placeholder="At least 6 characters"></div><div class="field"><label>COUNTRY</label><input id="country" placeholder="Country"></div><button class="btn" onclick="register()">Create Account</button><button class="btn alt" onclick="loginForm()">I already have an account</button></div></div>`}
async function register(){try{await api("/api/register",{method:"POST",body:JSON.stringify({name:name.value,email:email.value,password:pass.value,country:country.value})});me=await api("/api/me");onboard()}catch(e){toast(e.message)}}
function loginForm(){document.querySelector("#app").innerHTML=`<div class="hero"><div class="logo">Gro<span>Link</span></div><h2>Welcome back</h2></div><div class="screen"><div class="card"><div class="field"><label>EMAIL</label><input id="email" type="email"></div><div class="field"><label>PASSWORD</label><input id="pass" type="password"></div><button class="btn" onclick="login()">Log In</button><button class="btn alt" onclick="auth()">Create account</button></div></div>`}
async function login(){try{await api("/api/login",{method:"POST",body:JSON.stringify({email:email.value,password:pass.value})});me=await api("/api/me");render()}catch(e){toast(e.message)}}
function onboard(){let data={about:[],habits:[],goals:[],prefs:[],interests:[]},keys=["about","habits","goals","prefs","interests"],i=0;function page(){let k=keys[i],items={about:A,habits:H,goals:G,prefs:P,interests:I}[k];document.querySelector("#app").innerHTML=`<div class="top"><div class="logo">Gro<span>Link</span></div><b>${i+1}/5</b></div><div class="screen"><h2>${k==="about"?"Tell Us About You":k==="habits"?"Your Habits":k==="goals"?"Your Goals":k==="prefs"?"Friendship Preferences":"Your Interests"}</h2><p class="muted">Choose the things that describe your journey.</p><div class="grid">${items.map(x=>`<button class="chip ${data[k].includes(x)?"on":""}" onclick="this.classList.toggle('on');dataToggle('${k}',${JSON.stringify(x)})">${x}</button>`).join("")}</div><button class="btn" onclick="next()">Continue</button></div>`}window.dataToggle=(k,x)=>data[k].includes(x)?data[k]=data[k].filter(v=>v!==x):data[k].push(x);window.next=async()=>{if(i<4){i++;page()}else{await api("/api/profile",{method:"PUT",body:JSON.stringify({goals:data.goals,habits:data.habits,interests:data.interests,prefs:data.prefs})});me=await api("/api/me");render()}};page()}
function shell(title,body){document.querySelector("#app").innerHTML=`<div class="top"><div class="logo">Gro<span>Link</span></div><button class="btn small alt" onclick="logout()">Log out</button></div><div class="screen">${title?`<h2>${title}</h2>`:""}${body}</div><div class="nav"><button class="${tab==="home"?"active":""}" onclick="tab='home';render()">⌂<i>Home</i></button><button class="${tab==="discover"?"active":""}" onclick="tab='discover';render()">🌎<i>Discover</i></button><button class="${tab==="experience"?"active":""}" onclick="tab='experience';render()">🌱<i>Experiences</i></button><button class="${tab==="messages"?"active":""}" onclick="tab='messages';render()">💬<i>Messages</i></button><button class="${tab==="profile"?"active":""}" onclick="tab='profile';render()">👤<i>Profile</i></button></div>`}
async function logout(){await api("/api/logout",{method:"POST"});me=null;auth()}
async function render(){if(!me){auth();return}if(tab==="home")return home();if(tab==="discover")return discover();if(tab==="experience")return experience();if(tab==="messages")return messages();return profile()}
async function home(){let ps=(await api("/api/discover")).slice(0,3);shell("",`<div class="card"><div class="match"><div class="avatar">${esc(me.name[0])}</div><div><b>Good evening, ${esc(me.name)} 👋</b><div class="meta">Your direction matters more than your distance.</div></div></div></div><h3>🌎 Your potential connections</h3>${ps.map(person).join("")}<h3>🌱 Today's question</h3><div class="card"><b>What's one lesson you've learned this year?</b><button class="btn small" onclick="newExp()">Share your answer</button></div><h3>🎯 Your goal</h3><div class="card"><b>${esc((me.goals||[])[0]||"Choose your first goal")}</b><p class="muted">Keep learning, sharing and growing together.</p></div>`)}
function person(p){return `<div class="card"><div class="match"><div class="avatar">${esc(p.name[0])}</div><div class="main"><b>${esc(p.name)} · ${esc(p.country||"Global")}</b><div class="meta">${esc((p.interests||[]).slice(0,3).join(" · "))}</div></div><div class="score">${p.score}%</div></div><div class="why">✓ Shared goals and interests create a ${p.score}% GroLink match.</div><div class="row" style="margin-top:10px"><button class="btn alt small" onclick="profileOf(${p.id})">View</button>${p.connected?`<button class="btn small" onclick="chat(${p.id},'${esc(p.name)}')">Chat</button>`:`<button class="btn small" onclick="connect(${p.id})">Connect</button>`}</div></div>`}
async function discover(){let ps=await api("/api/discover");shell("Discover",`<div class="card"><b>People on a similar life journey</b><p class="muted">Matches use goals, habits, interests and friendship preferences.</p></div>${ps.map(person).join("")}`)}
async function connect(id){await api("/api/connect/"+id,{method:"POST"});toast("Connection created");tab="messages";render()}
async function profileOf(id){let p=(await api("/api/discover")).find(x=>x.id===id);shell("Why We Matched",`<div class="card" style="text-align:center"><div class="row" style="justify-content:center"><div><div class="avatar">${me.name[0]}</div><b>${esc(me.name)}</b></div><div style="font-size:28px;color:var(--g)">∞</div><div><div class="avatar">${esc(p.name[0])}</div><b>${esc(p.name)}</b></div></div><div class="score" style="font-size:28px;margin:16px">${p.score}% Compatibility</div><div class="why">You have enough in common to connect—and enough differences to learn from each other.</div><p class="muted"><b>Goals:</b> ${(p.goals||[]).join(" · ")}<br><b>Interests:</b> ${(p.interests||[]).join(" · ")}</p><button class="btn" onclick="connect(${p.id})">Connect</button></div>`)}
async function messages(){let cs=await api("/api/connections");shell("Messages",cs.length?cs.map(c=>`<div class="card"><div class="match"><div class="avatar">${esc(c.name[0])}</div><div class="main"><b>${esc(c.name)}</b><div class="meta">${esc(c.country)}</div></div><button class="btn small" onclick="chat(${c.id},'${esc(c.name)}')">Chat</button></div></div>`).join(""):`<div class="empty card">No connections yet.<br>Go to Discover and connect with someone who shares your direction.</div>`)}
async function chat(id,name){let msgs=await api("/api/messages/"+id);shell(name,`<div class="chat" id="chat">${msgs.length?msgs.map(m=>`<div class="msg ${m.sender_id===me.id?"me":""}">${esc(m.text)}</div>`).join(""):`<div class="msg">Hi! What's one goal you're working toward right now?</div>`}</div><div class="row"><input id="msg" placeholder="Type a message..."><button class="btn small" onclick="send(${id},'${esc(name)}')">Send</button></div><button class="btn alt" onclick="tab='messages';render()">Back</button>`);setTimeout(()=>document.querySelector("#chat")?.scrollTo(0,99999),20)}
async function send(id,name){let v=document.querySelector("#msg").value.trim();if(!v)return;await api("/api/messages/"+id,{method:"POST",body:JSON.stringify({text:v})});chat(id,name)}
async function experience(){let es=await api("/api/experiences"),cs=await api("/api/communities");shell("Experiences",`<div class="card"><b>🌱 Learn from real experiences</b><p class="muted">Share lessons from business, travel, education and life.</p><button class="btn small" onclick="newExp()">+ Share Experience</button></div>${es.map(e=>`<div class="card"><div class="match"><div class="avatar">${esc(e.name[0])}</div><div><b>${esc(e.name)}</b><div class="meta">${esc(e.country||"Global")} · ${esc(e.category)}</div></div></div><h3>${esc(e.title)}</h3><p class="muted">${esc(e.body)}</p><button class="btn alt small" onclick="toast('Connect with author from Discover')">Connect</button></div>`).join("")}<h3>👥 Communities</h3>${cs.map(c=>`<div class="card"><div class="match"><div class="avatar">${esc(c.name[0])}</div><div class="main"><b>${esc(c.name)}</b><div class="meta">${c.members} members</div></div>${c.joined?'<span class="pill">Joined</span>':`<button class="btn small" onclick="join(${c.id})">Join</button>`}</div><p class="muted">${esc(c.description)}</p></div>`).join("")}`)}
async function newExp(){let title=prompt("Experience title");if(!title)return;let body=prompt("What did you learn?");if(!body)return;await api("/api/experiences",{method:"POST",body:JSON.stringify({title,body})});toast("Experience published");tab="experience";render()}
async function join(id){await api("/api/communities/"+id+"/join",{method:"POST"});toast("Community joined");render()}
function profile(){shell("Profile",`<div class="card" style="text-align:center"><div class="avatar" style="margin:auto;width:76px;height:76px;font-size:28px">${esc(me.name[0])}</div><h2>${esc(me.name)}</h2><div class="meta">🌎 ${esc(me.country||"Global")}</div><p class="muted">${esc(me.bio||"Tell the GroLink community about yourself.")}</p><button class="btn alt small" onclick="editProfile()">Edit Profile</button></div><h3>🎯 Goals</h3><div class="card">${(me.goals||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join("")||"No goals selected."}</div><h3>✓ Habits</h3><div class="card">${(me.habits||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join("")||"No habits selected."}</div><h3>🌎 Interests</h3><div class="card">${(me.interests||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join("")||"No interests selected."}</div><div class="card"><b>🛡️ Safety & Privacy</b><p class="muted">Block/report controls and moderation should be enabled before public launch.</p></div>`)}
async function editProfile(){let name=prompt("Name",me.name),country=prompt("Country",me.country),bio=prompt("Bio",me.bio);if(name){me=await api("/api/profile",{method:"PUT",body:JSON.stringify({name,country,bio})});render()}}
boot();
</script></body></html>
